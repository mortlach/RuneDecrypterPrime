name: RDP V1 full CI

on:
  push:
    branches:
      - main
      - ScheduledStreamLookup
      - "prelease/**"
  pull_request:
    branches:
      - main
      - ScheduledStreamLookup
      - "prelease/**"
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"

jobs:
  full-ci:
    name: full CI / ${{ matrix.os }} / py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - ubuntu-latest
        python-version:
          - "3.11"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Run V1 installer smoke
        run: python install.py

      - name: Upload installer logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rdp-v1-install-logs-full-ci-${{ matrix.os }}-py${{ matrix.python-version }}
          path: output/install_logs/*.log
          if-no-files-found: warn

      - name: Run full pytest suite
        shell: python
        run: |
          from pathlib import Path
          import subprocess
          import sys

          log_dir = Path("output") / "ci_logs"
          log_dir.mkdir(parents=True, exist_ok=True)
          log_path = log_dir / "full_pytest.log"

          cmd = [sys.executable, "-m", "pytest", "-q", "-p", "no:cacheprovider"]
          proc = subprocess.run(
              cmd,
              text=True,
              stdout=subprocess.PIPE,
              stderr=subprocess.STDOUT,
          )
          log_path.write_text(proc.stdout, encoding="utf-8")
          print(proc.stdout, end="")
          raise SystemExit(proc.returncode)

      - name: Upload full pytest log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rdp-v1-full-pytest-log-${{ matrix.os }}-py${{ matrix.python-version }}
          path: output/ci_logs/full_pytest.log
          if-no-files-found: warn

      - name: Run V1 release tutorial runner
        shell: python
        run: |
          from pathlib import Path
          import subprocess
          import sys

          log_dir = Path("output") / "ci_logs"
          log_dir.mkdir(parents=True, exist_ok=True)
          log_path = log_dir / "tutorials_v1_release.log"

          script = Path("tutorials") / "v1" / "run_tutorials.py"
          if not script.is_file():
              raise SystemExit(f"Missing tutorial runner: {script}")

          cmd = [sys.executable, "-X", "utf8", str(script)]
          proc = subprocess.run(
              cmd,
              text=True,
              stdout=subprocess.PIPE,
              stderr=subprocess.STDOUT,
          )
          log_path.write_text(proc.stdout, encoding="utf-8")
          print(proc.stdout, end="")
          raise SystemExit(proc.returncode)

      - name: Upload V1 tutorial log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rdp-v1-tutorial-log-${{ matrix.os }}-py${{ matrix.python-version }}
          path: output/ci_logs/tutorials_v1_release.log
          if-no-files-found: warn
