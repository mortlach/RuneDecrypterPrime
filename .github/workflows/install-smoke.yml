name: V1 CI Smoke

on:
  push:
    branches:
      - main
      - "prelease/v1.0.0_*"
      - "prerelease/v1.0.0_*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  v1-ci-smoke:
    name: v1-ci-smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run CI-light installer
        run: python tools/ci/install_light.py
