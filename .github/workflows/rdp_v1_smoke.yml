name: RDP V1 smoke

on:
  push:
    branches:
      - main
      - ScheduledStreamLookup
      - "prelease/**"
  pull_request:
    branches:
      - main
      - ScheduledStreamLookup
      - "prelease/**"

permissions:
  contents: read

jobs:
  smoke:
    name: smoke / ${{ matrix.os }} / py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - ubuntu-latest
        python-version:
          - "3.11"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Run V1 installer smoke
        run: python install.py

      - name: Upload installer logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rdp-v1-install-logs-${{ matrix.os }}-py${{ matrix.python-version }}
          path: output/install_logs/*.log
          if-no-files-found: warn
