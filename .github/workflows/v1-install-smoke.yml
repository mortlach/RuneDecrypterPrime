name: V1 Install Smoke

on:
  push:
    branches:
      - main
      - "prelease/**"
  pull_request:
  workflow_dispatch:

jobs:
  v1-install-smoke:
    name: v1-install-smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run V1 CI-light installer
        run: python tools/ci/install_light.py
