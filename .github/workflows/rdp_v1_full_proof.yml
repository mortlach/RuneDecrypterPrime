name: RDP V1 full proof

on:
  workflow_dispatch:
  push:
    branches:
      - preleasev1.0.0_d5
      - prelease/v1.0.0_d6
      - prelease/v1.0.0_d7

permissions:
  contents: read

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"

jobs:
  full-proof:
    name: full proof / ${{ matrix.os }} / py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - ubuntu-latest
        python-version:
          - "3.11"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Run V1 installer smoke
        run: python install.py

      - name: Upload installer logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rdp-v1-install-logs-full-${{ matrix.os }}-py${{ matrix.python-version }}
          path: output/install_logs/*.log
          if-no-files-found: warn

      - name: Run full pytest suite
        shell: python
        run: |
          from pathlib import Path
          import subprocess
          import sys

          log_path = Path("output") / "test_logs" / "full_pytest.log"
          log_path.parent.mkdir(parents=True, exist_ok=True)

          cmd = [sys.executable, "-m", "pytest", "-q", "-ra", "-p", "no:cacheprovider", "tests"]
          print("Running:", " ".join(cmd))

          proc = subprocess.run(
              cmd,
              stdout=subprocess.PIPE,
              stderr=subprocess.STDOUT,
              text=True,
              encoding="utf-8",
              errors="replace",
          )
          log_path.write_text(proc.stdout, encoding="utf-8")

          lines = proc.stdout.splitlines()
          if proc.returncode:
              print("Full pytest failed. Output tail:")
              print("\n".join(lines[-200:]))
          else:
              print("Full pytest passed. Output tail:")
              print("\n".join(lines[-40:]))

          raise SystemExit(proc.returncode)

      - name: Upload full pytest log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rdp-v1-full-pytest-log-${{ matrix.os }}-py${{ matrix.python-version }}
          path: output/test_logs/full_pytest.log
          if-no-files-found: warn

      - name: Run V1 release tutorials
        shell: python
        run: |
          from pathlib import Path
          import subprocess
          import sys

          log_path = Path("output") / "test_logs" / "v1_release_tutorials.log"
          log_path.parent.mkdir(parents=True, exist_ok=True)

          cmd = [sys.executable, "-X", "utf8", "tutorials/v1/run_all.py"]
          print("Running:", " ".join(cmd))

          proc = subprocess.run(
              cmd,
              stdout=subprocess.PIPE,
              stderr=subprocess.STDOUT,
              text=True,
              encoding="utf-8",
              errors="replace",
          )
          log_path.write_text(proc.stdout, encoding="utf-8")

          lines = proc.stdout.splitlines()
          if proc.returncode:
              print("V1 release tutorials failed. Output tail:")
              print("\n".join(lines[-200:]))
          else:
              print("V1 release tutorials passed. Output tail:")
              print("\n".join(lines[-40:]))

          raise SystemExit(proc.returncode)

      - name: Upload V1 release tutorial log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rdp-v1-release-tutorial-log-${{ matrix.os }}-py${{ matrix.python-version }}
          path: output/test_logs/v1_release_tutorials.log
          if-no-files-found: warn
