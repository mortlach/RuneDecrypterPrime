name: RDP V1 full proof

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"

jobs:
  full-proof:
    name: V1 full proof / ${{ matrix.os }} / py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - ubuntu-latest
        python-version:
          - "3.11"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install and verify the canonical full_v1 asset profile
        run: python install.py

      - name: Run complete pytest suite with full assets
        shell: python
        run: |
          from pathlib import Path
          import subprocess
          import sys

          log_path = Path("output") / "test_logs" / "full_pytest.log"
          log_path.parent.mkdir(parents=True, exist_ok=True)
          cmd = [sys.executable, "-m", "pytest", "-q", "-ra", "-p", "no:cacheprovider", "tests"]
          proc = subprocess.run(
              cmd,
              text=True,
              encoding="utf-8",
              errors="replace",
              stdout=subprocess.PIPE,
              stderr=subprocess.STDOUT,
          )
          log_path.write_text(proc.stdout, encoding="utf-8")
          print(proc.stdout, end="")
          raise SystemExit(proc.returncode)

      - name: Run representative V1 examples with full assets
        shell: python
        run: |
          from pathlib import Path
          import importlib.util
          import subprocess
          import sys

          log_path = Path("output") / "test_logs" / "full_v1_tutorials.log"
          log_path.parent.mkdir(parents=True, exist_ok=True)
          script = Path("tutorials") / "v1" / "run_tutorials.py"
          code = (
              "import importlib.util, pathlib, sys; "
              f"script = pathlib.Path({str(script)!r}); "
              "spec = importlib.util.spec_from_file_location('rdp_full_tutorial_runner', script); "
              "mod = importlib.util.module_from_spec(spec); "
              "sys.modules[spec.name] = mod; "
              "spec.loader.exec_module(mod); "
              "mod.RUN_SET = mod.TutorialRunSet.FULL_ASSET_EXAMPLES; "
              "raise SystemExit(mod.main())"
          )
          proc = subprocess.run(
              [sys.executable, "-X", "utf8", "-c", code],
              text=True,
              encoding="utf-8",
              errors="replace",
              stdout=subprocess.PIPE,
              stderr=subprocess.STDOUT,
          )
          log_path.write_text(proc.stdout, encoding="utf-8")
          print(proc.stdout, end="")
          raise SystemExit(proc.returncode)

      - name: Upload full-proof logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rdp-v1-full-proof-${{ matrix.os }}-py${{ matrix.python-version }}
          path: |
            output/install/**/*.log
            output/install/**/*.json
            output/test_logs/*.log
            output/tutorial_logs/**/*.txt
          if-no-files-found: warn
