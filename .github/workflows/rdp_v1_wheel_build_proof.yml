name: RDP V1 wheel build proof (manual, non-authoritative)

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"

jobs:
  build-wheels:
    name: wheel proof / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - ubuntu-latest

    env:
      CIBW_BUILD: "cp311-*"
      CIBW_SKIP: "*-musllinux_*"
      CIBW_TEST_COMMAND: >-
        python -c "import importlib;
        importlib.import_module('rune_decrypter_prime');
        importlib.import_module('rdp');
        importlib.import_module('rune_decrypter_prime.scoring.language_model._fastlm');
        importlib.import_module('rune_decrypter_prime.scoring.hamming._hamming');
        importlib.import_module('rune_decrypter_prime.scoring.span_hamming._span_hamming_fast');
        print('wheel package and native imports passed')"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python for cibuildwheel driver
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install cibuildwheel
        run: python -m pip install cibuildwheel

      - name: Build and test CPython 3.11 wheels
        run: python -m cibuildwheel --output-dir wheelhouse

      - name: Upload wheel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rdp-v1-wheelhouse-${{ matrix.os }}
          path: wheelhouse/*.whl
          if-no-files-found: error
