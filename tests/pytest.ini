# pytest.ini
[pytest]
testpaths = tests
python_files = test_*.py
markers =
    guardrails: repository guardrails tests
    smoke: fast smoke tests
    tier_a: fast Stage-2 contract tests (<5s)
    tier_b: heavier scenarios (opt-in)
    long: long-running tutorial/regression coverage
    legacy: skipped Stage-1 suites
    cuda: tests that require CUDA and auto-skip elsewhere
