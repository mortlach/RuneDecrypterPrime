[build-system]
requires = ["setuptools>=68", "wheel", "pybind11>=2.13.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rune-decrypter-prime"
version = "1.0.0"
description = "Deterministic, solving toolkit for a 29-rune alphabet."
authors = [{ name = "mortlach" }]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "zstandard>=0.22",
  "tzdata>=2024.1",
  "lark>=1.1",
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "License :: OSI Approved :: MIT License",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
]

[project.optional-dependencies]
community-runner = [
  "jsonschema>=4.23.0",
  "pybind11>=2.13.0",
]
community-organiser = [
  "jsonschema>=4.23.0",
]
dev = [
  "pytest>=8.0",
  "ruff>=0.5.0",
  "mypy>=1.11.0",
  "pre-commit>=3.0",
  "jsonschema>=4.23.0",
]
test = [
  "pytest>=8.0",
  "jsonschema>=4.23.0",
]
torch = [
  "torch",
]
test-torch = [
  "pytest>=8.0",
  "jsonschema>=4.23.0",
  "torch",
]

[project.urls]
Homepage = "https://github.com/mortlach/RuneDecrypterPrime"
Documentation = "https://github.com/mortlach/RuneDecrypterPrime/tree/main/docs"
Issues = "https://github.com/mortlach/RuneDecrypterPrime/issues"

[tool.setuptools.packages.find]
where = ["src"]
include = ["rune_decrypter_prime*", "rdp*"]
exclude = [
  "rune_decrypter_prime.ciphers.dev",
  "rune_decrypter_prime.ciphers.dev.*",
  "rune_decrypter_prime.keyops.dev",
  "rune_decrypter_prime.keyops.dev.*",
  "rune_decrypter_prime.data.liber_primus.old",
  "rune_decrypter_prime.data.liber_primus.old.*",
]

[tool.setuptools.package-data]
rdp = ["py.typed"]
rune_decrypter_prime = [
  "data/cipher_tests/books/*.npz",
  "data/cipher_tests/books/*.json",
]

[tool.pytest.ini_options]
markers = [
  "tier_a: fast deterministic unit or contract test",
  "full_assets: requires the canonical full_v1 LM1-LM4 asset profile",
  "torch: tests that require the optional Torch runtime; skipped when torch is unavailable",
]

[tool.ruff]
target-version = "py311"
extend-exclude = ["src/rune_decrypter_prime/ciphers/dev"]

[tool.ruff.lint.per-file-ignores]
"cipher_development/**/*.py" = ["E402"]
"solving/**/*.py" = ["E402"]
"tools/**/*.py" = ["E402"]
"tutorials/**/*.py" = ["E402"]
"tests/conftest.py" = ["E402"]
"src/rdp/api/normalize.py" = ["E701"]
"src/rune_decrypter_prime/ciphers/__init__.py" = ["F401"]
"src/rune_decrypter_prime/ciphers/vigenere_cipher.py" = ["E702"]
"src/rune_decrypter_prime/core/config/solver.py" = ["E702"]
"src/rdp/data/liber_primus/lp_transcript.py" = ["E741", "F841"]
"src/rune_decrypter_prime/keyops/base_keyops.py" = ["F811"]
"src/rune_decrypter_prime/keyops/dev/matrix.py" = ["E702", "E703"]
"src/rune_decrypter_prime/scoring/base_scorer.py" = ["F811"]
"src/rune_decrypter_prime/scoring/language_model/language_model_prime.py" = ["E702"]
"src/rune_decrypter_prime/scoring/policy.py" = ["E702"]
"src/rune_decrypter_prime/scoring/torch_rune_scorer.py" = ["E702"]
"src/rune_decrypter_prime/solvers/ga.py" = ["E702"]
"src/rune_decrypter_prime/solvers/sa.py" = ["E702", "E741"]
"src/rune_decrypter_prime/solvers/solver_base.py" = ["E702"]
"src/rune_decrypter_prime/utils/pretty.py" = ["E701", "E702", "E731"]
"src/rdp/data/runeglish.py" = ["E702", "E741", "F811"]
"src/rune_decrypter_prime/utils/seed_utils.py" = ["E702"]
"tests/api/test_run_logging_routing.py" = ["E731"]
"tests/api/test_run_routing.py" = ["E731"]
"tests/ciphers/test_substitution_interruptor_pipeline.py" = ["F841"]
"tests/harness.py" = ["F841"]
"tests/scoring/test_hamming_integration.py" = ["E741"]
"tests/scoring/test_scorer_report_json_safe.py" = ["F841"]
"tests/scoring/test_scorer_smoothing_effect.py" = ["F841"]
"tests/scoring/test_scoring_integrity.py" = ["F841"]
"tests/solvers/test_a4_two_period_stage_status.py" = ["E731"]
