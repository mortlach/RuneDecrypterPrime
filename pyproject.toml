[build-system]
requires = ["setuptools>=68", "wheel", "pybind11>=2.13.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rune-decrypter-prime"
version = "1.0.0"
description = "Deterministic, solving toolkit for a 29-rune alphabet."
authors = [{ name = "mortlach" }]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "zstandard>=0.22",
  "tzdata>=2024.1",
]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]

[project.optional-dependencies]
community-runner = [
  "jsonschema>=4.23.0",
  "pybind11>=2.13.0",
]
community-organiser = [
  "jsonschema>=4.23.0",
]
dev = [
  "pytest>=8.0",
  "ruff>=0.5.0",
  "pre-commit>=3.0",
  "jsonschema>=4.23.0",
]
test = [
  "pytest>=8.0",
  "jsonschema>=4.23.0",
]

[project.urls]
Homepage = "https://github.com/mortlach/RuneDecrypterPrime"
Documentation = "https://github.com/mortlach/RuneDecrypterPrime/tree/main/docs"
Issues = "https://github.com/mortlach/RuneDecrypterPrime/issues"

[tool.setuptools.packages.find]
where = ["src"]
include = ["rune_decrypter_prime*", "rdp*"]
